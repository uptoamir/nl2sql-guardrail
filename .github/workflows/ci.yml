name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  lint-typecheck-test:
    name: lint + typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.4"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies (with dev extras)
        run: uv sync --frozen --extra dev --extra ui

      - name: Ruff lint
        # Match local: lint src/ only. Tests have unique idioms (unused
        # tuple-unpacking from scipy.chisquare, etc.) that don't fit
        # production lint rules. Test linting is a planned follow-up.
        run: uv run ruff check src/

      - name: Ruff format check
        run: uv run ruff format --check src/

      - name: Mypy --strict
        run: uv run mypy --strict src/

      - name: Pytest (unit + property + redteam + integration)
        run: uv run pytest tests/ -q --tb=short

      - name: Verify launcher script is executable
        run: test -x ./nl2sql || (echo "nl2sql launcher not executable" && exit 1)

# NOTE: Deploy is handled by Railway's "Wait for CI" feature (Settings →
# Source → Wait for CI). Railway watches this CI workflow's status and only
# deploys when it succeeds. No GitHub Actions deploy step needed — Railway
# is the deployer, gated on CI green.
